name: PREIS Ebola DRC SitRep Monitor V2

on:
  workflow_dispatch:
    inputs:
      send:
        description: "Send PREIS email alerts"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      force_send:
        description: "Force send during manual test"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
  repository_dispatch:
    types: [preis_monitor]
  schedule:
    - cron: "7,37 * * * *"
env:
  SEND: "${{ github.event_name == 'workflow_dispatch' && inputs.send || 'true' }}"
  SEND_EMAIL: "${{ github.event_name == 'workflow_dispatch' && inputs.send || 'true' }}"
  SEND_ALERTS: "${{ github.event_name == 'workflow_dispatch' && inputs.send || 'true' }}"
  PREIS_SEND: "${{ github.event_name == 'workflow_dispatch' && inputs.send || 'true' }}"
  PREIS_SEND_EMAIL: "${{ github.event_name == 'workflow_dispatch' && inputs.send || 'true' }}"
  EMAIL_ENABLED: "${{ github.event_name == 'workflow_dispatch' && inputs.send || 'true' }}"
  PREIS_EMAIL_ENABLED: "${{ github.event_name == 'workflow_dispatch' && inputs.send || 'true' }}"
  FORCE_SEND: "${{ github.event_name == 'workflow_dispatch' && inputs.force_send || 'false' }}"
  PREIS_FORCE_SEND: "${{ github.event_name == 'workflow_dispatch' && inputs.force_send || 'false' }}"
  DRY_RUN: "false"
permissions:
  contents: write

concurrency:
  group: preis-sitrep-monitor-v2
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      PREIS_DRY_RUN: 'FALSE'
      PREIS_MAX_PAGES: '6'

      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      ALERT_FROM: ${{ secrets.ALERT_FROM }}
      ALERT_TO: ${{ secrets.ALERT_TO }}
      ALERT_CC: ${{ secrets.ALERT_CC }}
      ALERT_BCC: ${{ secrets.ALERT_BCC }}
      # PREIS FIX 2026-08-04 : destinataires dedies du supplement Africa CDC.
      # Si le secret n'est pas defini, 05_send_africacdc_sitrep_email.R retombe
      # automatiquement sur ALERT_TO (aucun blocage).
      PREIS_AFRICACDC_TO: ${{ secrets.PREIS_AFRICACDC_TO }}

      WA_ENABLED: ${{ secrets.WA_ENABLED }}
      WA_ACCESS_TOKEN: ${{ secrets.WA_ACCESS_TOKEN }}
      WA_PHONE_NUMBER_ID: ${{ secrets.WA_PHONE_NUMBER_ID }}
      WA_TO: ${{ secrets.WA_TO }}
      WA_API_VERSION: ${{ secrets.WA_API_VERSION }}
      WA_STRICT: ${{ secrets.WA_STRICT }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup R
        uses: r-lib/actions/setup-r@v2

      - name: Confirm Python available
        run: |
          python3 --version

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            make \
            libfontconfig1-dev \
            libcairo2-dev \
            libfreetype6-dev \
            libpng-dev \
            libtiff5-dev \
            libjpeg-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libpoppler-cpp-dev
          # PREIS FIX 2026-08-04 : les 7 libs (fontconfig -> fribidi) sont
          # necessaires a systemfonts/gdtools/ragg, donc a flextable +
          # ggsave() utilises par 06_generate_africa_cdc_sitrep_final.R.
          # PREIS FIX 2026-08-05 : libpoppler-cpp-dev requis par pdftools si
          # celui-ci doit compiler depuis les sources (filet de securite).
          # Sans ces libs, la generation du docx echouait silencieusement
          # (avalee par continue-on-error) et le supplement n'etait jamais cree.

      - name: Install R packages
        run: |
          Rscript --vanilla -e 'install.packages(c("httr","rvest","xml2","stringr","dplyr","readr","tibble","purrr","digest","base64enc","jsonlite"), repos="https://cloud.r-project.org")'

      - name: Confirm R packages
        run: |
          Rscript --vanilla -e 'pkgs <- c("httr","rvest","xml2","stringr","dplyr","readr","tibble","purrr","digest","base64enc","jsonlite"); missing <- pkgs[!vapply(pkgs, requireNamespace, logical(1), quietly=TRUE)]; if(length(missing)>0) stop("Packages manquants: ", paste(missing, collapse=", ")); cat("All R packages OK\n")'

      - name: Check email secrets
        run: |
          Rscript --vanilla -e 'required <- c("SMTP_USER","SMTP_PASS","SMTP_HOST","SMTP_PORT","ALERT_FROM","ALERT_TO"); missing <- required[!nzchar(Sys.getenv(required))]; if (length(missing) > 0) stop("Secrets email manquants: ", paste(missing, collapse=", ")); cat("Email secrets OK\n")'

      - name: Check WhatsApp secrets if enabled
        run: |
          Rscript --vanilla -e 'enabled <- toupper(Sys.getenv("WA_ENABLED","FALSE")) %in% c("TRUE","1","YES","Y"); if (enabled) { required <- c("WA_ACCESS_TOKEN","WA_PHONE_NUMBER_ID","WA_TO"); missing <- required[!nzchar(Sys.getenv(required))]; if (length(missing) > 0) stop("Secrets WhatsApp manquants: ", paste(missing, collapse=", ")); cat("WhatsApp secrets OK\n") } else { cat("WhatsApp disabled\n") }'

      - name: Check no legacy curl SMTP sender
        run: |
          if grep -nE 'Erreur envoi SMTP curl|curl_bin|curl::mime|curl::send_mail' scripts/00_email_smtp_base.R; then
            echo 'Legacy curl SMTP email sender detected. Stop.'
            exit 1
          fi
          echo 'No legacy curl SMTP email sender'

      - name: Parse R scripts
        env:
          SEND: false
          SEND_EMAIL: false
          SEND_ALERTS: false
          PREIS_SEND: false
          PREIS_SEND_EMAIL: false
          EMAIL_ENABLED: false
          PREIS_EMAIL_ENABLED: false
          FORCE_SEND: false
          PREIS_FORCE_SEND: false
        run: |
          Rscript --vanilla -e 'parse(file="scripts/00_email_smtp_base.R", encoding="UTF-8"); parse(file="scripts/08_cloud_sitrep_monitor.R", encoding="UTF-8"); parse(file="scripts/preis_safe_scientific_email.R", encoding="UTF-8"); parse(file="preis_email_enrichi.R", encoding="UTF-8"); parse(file="scripts/05_send_africacdc_sitrep_email.R", encoding="UTF-8"); parse(file="scripts/06_generate_africa_cdc_sitrep_final.R", encoding="UTF-8"); if (file.exists("scripts/10_whatsapp_notify.R")) parse(file="scripts/10_whatsapp_notify.R", encoding="UTF-8"); cat("R parse OK\n")'

      # PREIS SAFE EMAIL GUARANTEE START
      - name: PREIS safe scientific email guarantee
        if: always()
        env:
          # Keep the robust INSP/PDF resolver, but do not send the old PDF-only email.
          # The single notification is sent later by preis_email_enrichi.R after analysis.
          PREIS_SAFE_EMAIL_ENABLED: "false"
          PREIS_FORCE_SEND: ${{ github.event_name == 'workflow_dispatch' && inputs.force_send || 'false' }}
          FORCE_SEND: ${{ github.event_name == 'workflow_dispatch' && inputs.force_send || 'false' }}
          PREIS_SAFE_EMAIL_TO: ${{ secrets.PREIS_SAFE_EMAIL_TO }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: Rscript --vanilla scripts/preis_safe_scientific_email.R
      # PREIS SAFE EMAIL GUARANTEE END
      # PREIS SAFE EMAIL STATE COMMIT START
      - name: Commit PREIS safe email notification state
        if: always()
        run: |
          set +e
          if [ -f data/preis_safe_email_notification_state.csv ]; then
            git config user.name "PREIS Ebola DRC Automation"
            git config user.email "preis-automation@users.noreply.github.com"
            git add data/preis_safe_email_notification_state.csv
            git diff --cached --quiet && echo "No safe email state change to commit" && exit 0
            git commit -m "Update PREIS safe email notification state [skip ci]"
            git push
          else
            echo "No safe email state file found"
          fi
          exit 0
      # PREIS SAFE EMAIL STATE COMMIT END
      - name: Run PREIS SitRep monitor
        env:
          # PREIS FIX 2026-08-04 : email du monitor delegue a preis_email_enrichi.R
          # (une seule voie email officielle, cf. revue globale section 3.3).
          # Detection + telechargement PDF + WhatsApp restent actifs.
          # Rend explicite dans le workflow ce que la revue supposait deja
          # ("Email monitor : OFF (delegue)"), au cas ou un second email
          # "Nouveau SitRep INSP" reapparaitrait.
          PREIS_MONITOR_EMAIL_ENABLED: "false"
        run: |
          Rscript --vanilla scripts/08_cloud_sitrep_monitor.R

      # ------------------------------------------------------------
      # PATCH 2026-07-15 P2/P3 : chaine d'extraction, indicateurs,
      # analyse consolidee. Ces steps etaient absents du workflow,
      # ce qui bloquait le dashboard sur son fallback (SR 28).
      # continue-on-error: chaque etape peut echouer sans casser
      # le download PDF ni les commits en aval.
      # ------------------------------------------------------------
      - name: Install R packages pipeline (extraction + analyse)
        run: |
          # PREIS FIX 2026-08-05 : installation en BINAIRES via Posit Package
          # Manager (P3M) au lieu du CRAN source. Sans cela, flextable/officer
          # (et leurs deps gdtools/systemfonts/ragg) compilent depuis les
          # sources sur le runner et echouent silencieusement -> 06 plantait sur
          # "there is no package called 'flextable'".
          # - le codename Ubuntu est detecte dynamiquement (jammy/noble...) ;
          # - HTTPUserAgent est OBLIGATOIRE pour que P3M serve des binaires
          #   Linux (ignore par Rprofile a cause de --vanilla, donc pose ici) ;
          # - verification finale : le step ECHOUE si un package manque.
          Rscript --vanilla -e 'os <- readLines("/etc/os-release"); cn <- sub("^VERSION_CODENAME=", "", grep("^VERSION_CODENAME=", os, value=TRUE)); if (length(cn)==0 || !nzchar(cn)) cn <- "jammy"; repo <- sprintf("https://packagemanager.posit.co/cran/__linux__/%s/latest", cn); options(HTTPUserAgent = sprintf("R/%s R (%s)", getRversion(), paste(getRversion(), R.version$platform, R.version$arch, R.version$os)), repos = c(P3M = repo)); pkgs <- c("pdftools","tidyr","lubridate","ggplot2","openxlsx","zoo","officer","flextable"); ti <- pkgs[!vapply(pkgs, requireNamespace, logical(1), quietly=TRUE)]; if (length(ti)>0) install.packages(ti); miss <- pkgs[!vapply(pkgs, requireNamespace, logical(1), quietly=TRUE)]; if (length(miss)>0) stop("Packages pipeline non installes: ", paste(miss, collapse=", ")); cat("Pipeline packages OK on", cn, "\n")'

      - name: Normaliser les noms de PDFs (P3)
        if: always()
        continue-on-error: true
        run: |
          if [ -f scripts/06_normalize_pdf_names.R ]; then
            Rscript --vanilla scripts/06_normalize_pdf_names.R || echo "06_normalize_pdf_names.R en erreur"
          else
            echo "scripts/06_normalize_pdf_names.R absent - skip normalisation"
          fi

      - name: Extraction PDFs vers texte (03_extract_pdf.R)
        if: always()
        continue-on-error: true
        run: |
          Rscript --vanilla scripts/03_extract_pdf.R || echo "03_extract_pdf.R en erreur"

      - name: Extraction indicateurs (04_extract_indicators.R)
        if: always()
        continue-on-error: true
        run: |
          Rscript --vanilla scripts/04_extract_indicators.R || echo "04_extract_indicators.R en erreur"

      - name: Indicateurs journaliers (11_daily_indicators.R)
        if: always()
        continue-on-error: true
        run: |
          Rscript --vanilla scripts/11_daily_indicators.R || echo "11_daily_indicators.R en erreur"

      - name: Analyse consolidee - serie temporelle nationale (03_analyse_consolidee.R)
        if: always()
        continue-on-error: true
        run: |
          Rscript --vanilla scripts/03_analyse_consolidee.R || echo "03_analyse_consolidee.R en erreur"

      # PREIS AFRICA CDC SUPPLEMENT GENERATION START
      # PREIS FIX 2026-08-04 : etape MANQUANTE. Genere le document d'analyse
      # supplementaire (outputs/rapports/PREIS_AfricaCDC_SitRep_<NNN>_FINAL.docx)
      # a partir des indicateurs deja produits ci-dessus. Doit tourner APRES
      # 11_daily_indicators.R et 03_analyse_consolidee.R. continue-on-error pour
      # ne jamais casser le pipeline ; l'envoi (etape 05) est bloque proprement
      # si le docx n'existe pas.
      - name: Generer le supplement Africa CDC (06_generate_africa_cdc_sitrep_final.R)
        if: always()
        continue-on-error: true
        run: |
          if [ -f scripts/06_generate_africa_cdc_sitrep_final.R ]; then
            if [ ! -f scripts/operational_watch.R ]; then
              echo "ATTENTION : scripts/operational_watch.R absent -> 06 va s'arreter (dependance requise)."
            fi
            Rscript --vanilla scripts/06_generate_africa_cdc_sitrep_final.R || echo "06_generate_africa_cdc_sitrep_final.R en erreur"
          else
            echo "scripts/06_generate_africa_cdc_sitrep_final.R absent - skip generation supplement"
          fi
      # PREIS AFRICA CDC SUPPLEMENT GENERATION END

      # PREIS DASHBOARD DATA SYNC START
      - name: Synchroniser les donnees du dashboard
        if: always()
        run: |
          mkdir -p dashboard_ebola/data
          if [ -f outputs/analyse/serie_temporelle_nationale.csv ]; then
            cp -f outputs/analyse/serie_temporelle_nationale.csv dashboard_ebola/data/serie_temporelle_nationale.csv
          else
            echo 'Serie nationale absente - synchronisation ignoree'
          fi
          if [ -f outputs/analyse/tableau_zones_sante.csv ]; then
            cp -f outputs/analyse/tableau_zones_sante.csv dashboard_ebola/data/tableau_zones_sante.csv
          else
            echo 'Tableau zones absent - synchronisation ignoree'
          fi
      # PREIS DASHBOARD DATA SYNC END
      # PREIS ENRICHED EMAIL START
      - name: Send PREIS enriched email
        if: always() && env.PREIS_SEND_EMAIL == 'true'
        continue-on-error: true
        run: |
          if [ -f preis_email_enrichi.R ]; then
            Rscript --vanilla -e 'parse(file="preis_email_enrichi.R", encoding="UTF-8"); cat("preis_email_enrichi.R parse OK\n")'
            Rscript --vanilla preis_email_enrichi.R
          else
            echo "preis_email_enrichi.R absent - skip enriched email"
          fi
      # PREIS ENRICHED EMAIL END

      # PREIS ENRICHED EMAIL STATE COMMIT START
      # PREIS FIX 2026-08-04 : CAUSE RACINE DU DOUBLON D'EMAIL.
      # L'anti-doublon de l'email enrichi (data/preis_email_enrichi_state.csv)
      # n'etait committe qu'a la toute fin, via "git push || echo" qui avale
      # silencieusement un push rejete. Quand ce push echouait (course entre
      # runs cron), l'etat "deja envoye" n'arrivait jamais sur le depot et le
      # run suivant renvoyait le MEME email. On committe donc l'etat
      # IMMEDIATEMENT apres l'envoi, avec re-essais (fetch+rebase), exactement
      # comme pour l'email "safe scientific".
      - name: Commit PREIS enriched email state
        if: always()
        run: |
          set +e
          if [ -f data/preis_email_enrichi_state.csv ]; then
            git config user.name "PREIS Ebola DRC Automation"
            git config user.email "preis-automation@users.noreply.github.com"
            git add data/preis_email_enrichi_state.csv
            if git diff --cached --quiet; then
              echo "No enriched email state change to commit"
              exit 0
            fi
            git commit -m "Update PREIS enriched email anti-duplicate state [skip ci]"
            ok=0
            for i in 1 2 3 4 5; do
              if git push; then ok=1; break; fi
              echo "Push rejete (tentative $i) - resynchronisation avant re-essai"
              git pull --rebase origin main || true
            done
            if [ "$ok" != "1" ]; then
              echo "ECHEC CRITIQUE : etat anti-doublon enrichi NON pousse apres 5 essais."
              echo "Risque de renvoi du meme email au prochain run cron."
              exit 1
            fi
          else
            echo "No enriched email state file found"
          fi
      # PREIS ENRICHED EMAIL STATE COMMIT END

      # PREIS AFRICA CDC SUPPLEMENT EMAIL START
      # PREIS FIX 2026-08-04 : etape MANQUANTE. Envoie le docx supplement dans
      # un email SEPARE (decision de conception du 2026-07-29 : ne pas joindre
      # le docx a l'email enrichi). Anti-doublon propre :
      # data/preis_africacdc_email_state.csv. Bloque proprement si le docx
      # n'a pas ete genere.
      - name: Send Africa CDC supplement email (05_send_africacdc_sitrep_email.R)
        if: always() && env.PREIS_SEND_EMAIL == 'true'
        continue-on-error: true
        run: |
          if [ -f scripts/05_send_africacdc_sitrep_email.R ]; then
            Rscript --vanilla scripts/05_send_africacdc_sitrep_email.R || echo "05_send_africacdc_sitrep_email.R en erreur (docx probablement absent)"
          else
            echo "scripts/05_send_africacdc_sitrep_email.R absent - skip supplement email"
          fi
      # PREIS AFRICA CDC SUPPLEMENT EMAIL END

      # PREIS AFRICA CDC STATE COMMIT START
      # PREIS FIX 2026-08-04 : meme robustesse que l'email enrichi pour
      # l'anti-doublon du supplement Africa CDC.
      - name: Commit Africa CDC email state + supplement
        if: always()
        run: |
          set +e
          git config user.name "PREIS Ebola DRC Automation"
          git config user.email "preis-automation@users.noreply.github.com"
          git add data/preis_africacdc_email_state.csv 2>/dev/null || true
          git add outputs/rapports/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No Africa CDC state/supplement change to commit"
            exit 0
          fi
          git commit -m "Update PREIS Africa CDC supplement + anti-duplicate state [skip ci]"
          ok=0
          for i in 1 2 3 4 5; do
            if git push; then ok=1; break; fi
            echo "Push rejete (tentative $i) - resynchronisation avant re-essai"
            git pull --rebase origin main || true
          done
          if [ "$ok" != "1" ]; then
            echo "AVERTISSEMENT : supplement Africa CDC / etat non pousse apres 5 essais."
          fi
          exit 0
      # PREIS AFRICA CDC STATE COMMIT END

      - name: Commit monitor + pipeline outputs
        if: always()
        run: |
          git config user.name "PREIS Ebola Automation"
          git config user.email "actions@github.com"
          git add data/monitor_state/ data/pdf/ data/logs/ outputs/cloud_monitor/ || true
          git add data/final/PREIS_indicators_long.csv || true
          git add data/final/PREIS_daily_indicators.csv || true
          git add data/final/PREIS_indicators_validated.csv || true
          git add data/final/PREIS_health_zones.csv || true
          git add data/final/PREIS_QC_by_sitrep.csv || true
          git add data/final/PREIS_QC_issues.csv || true
          git add data/final/PREIS_signals.csv || true
          git add data/final/PREIS_signals_text.txt || true
          git add data/final/PREIS_validation_signals.csv || true
          git add data/final/PREIS_validation_vs_INRB.csv || true
          git add data/final/sitrep_registry.csv || true
          git add outputs/analyse/serie_temporelle_nationale.csv || true
          git add outputs/analyse/tableau_zones_sante.csv || true
          git add outputs/audit/ || true
          git add outputs/rapports/ || true
          git add data/preis_email_enrichi_state.csv || true
          git add data/preis_africacdc_email_state.csv || true
          git add dashboard_ebola/data/serie_temporelle_nationale.csv || true
          git add dashboard_ebola/data/tableau_zones_sante.csv || true
          git status --short
          git commit -m "PREIS pipeline: monitor + extraction + analyse [skip ci]" || echo "No changes to commit"
          # PREIS FIX 2026-08-04 : push robuste avec re-essais au lieu de
          # "git push || echo" qui avalait un push rejete (perte de commit).
          ok=0
          for i in 1 2 3 4 5; do
            if git push; then ok=1; break; fi
            echo "Push rejete (tentative $i) - resynchronisation avant re-essai"
            git pull --rebase origin main || true
          done
          if [ "$ok" != "1" ]; then
            echo "AVERTISSEMENT : outputs pipeline non pousses apres 5 essais."
          fi
