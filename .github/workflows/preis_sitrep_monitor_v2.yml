name: PREIS Ebola DRC SitRep Monitor V2

on:
  workflow_dispatch:
    inputs:
      send:
        description: "Send PREIS email alerts"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      force_send:
        description: "Force send during manual test"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
  repository_dispatch:
    types: [preis_monitor]
  schedule:
    - cron: "7,37 * * * *"
env:
  SEND: "${{ github.event_name == 'workflow_dispatch' && inputs.send || 'true' }}"
  SEND_EMAIL: "${{ github.event_name == 'workflow_dispatch' && inputs.send || 'true' }}"
  SEND_ALERTS: "${{ github.event_name == 'workflow_dispatch' && inputs.send || 'true' }}"
  PREIS_SEND: "${{ github.event_name == 'workflow_dispatch' && inputs.send || 'true' }}"
  PREIS_SEND_EMAIL: "${{ github.event_name == 'workflow_dispatch' && inputs.send || 'true' }}"
  EMAIL_ENABLED: "${{ github.event_name == 'workflow_dispatch' && inputs.send || 'true' }}"
  PREIS_EMAIL_ENABLED: "${{ github.event_name == 'workflow_dispatch' && inputs.send || 'true' }}"
  FORCE_SEND: "${{ github.event_name == 'workflow_dispatch' && inputs.force_send || 'false' }}"
  PREIS_FORCE_SEND: "${{ github.event_name == 'workflow_dispatch' && inputs.force_send || 'false' }}"
  DRY_RUN: "false"
permissions:
  contents: write

concurrency:
  group: preis-sitrep-monitor-v2
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      PREIS_DRY_RUN: 'FALSE'
      PREIS_MONITOR_EMAIL_ENABLED: 'FALSE'
      PREIS_MAX_PAGES: '6'
      # NB: on n'impose plus R_LIBS_SITE - setup-r@v2 configure la bonne libpath.

      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      ALERT_FROM: ${{ secrets.ALERT_FROM }}
      ALERT_TO: ${{ secrets.ALERT_TO }}
      ALERT_CC: ${{ secrets.ALERT_CC }}
      ALERT_BCC: ${{ secrets.ALERT_BCC }}

      WA_ENABLED: ${{ secrets.WA_ENABLED }}
      WA_ACCESS_TOKEN: ${{ secrets.WA_ACCESS_TOKEN }}
      WA_PHONE_NUMBER_ID: ${{ secrets.WA_PHONE_NUMBER_ID }}
      WA_TO: ${{ secrets.WA_TO }}
      WA_API_VERSION: ${{ secrets.WA_API_VERSION }}
      WA_STRICT: ${{ secrets.WA_STRICT }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      # ------------------------------------------------------------------
      # CORRECTIF ABI DEFINITIF
      # Cause racine des erreurs "SETLENGTH" et "Master pipeline packages
      # missing" : mélange des binaires r-cran-* d'Ubuntu (compilés pour
      # une version de R) avec un R installé par setup-r-@v2 (autre version).
      # Solution : une seule source de paquets = P3M (binaires prêts à
      # l'emploi, alignés sur la version de R installée).
      # ------------------------------------------------------------------
      - name: Setup R (version épinglée + P3M)
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.2'
          use-public-rspm: true

      - name: Setup Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Confirm Python available
        run: |
          python3 --version

      - name: Install Linux system dependencies (headers uniquement)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libpoppler-cpp-dev \
            libfontconfig1-dev \
            libqpdf-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libfreetype6-dev \
            libpng-dev \
            libtiff5-dev \
            libjpeg-dev \
            libsodium-dev \
            pkg-config \
            make
          # IMPORTANT : PAS de r-cran-* ici. Ils cassent l'ABI de rlang.

      - name: Install all PREIS R packages (binaires P3M)
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::rlang
            any::httr
            any::httr2
            any::rvest
            any::xml2
            any::stringr
            any::dplyr
            any::readr
            any::tibble
            any::tidyr
            any::purrr
            any::digest
            any::base64enc
            any::jsonlite
            any::pdftools
            any::lubridate
            any::ggplot2
            any::openxlsx
            any::zoo
            any::glue
            any::keyring
            any::blastula
            any::officer
            any::flextable
            any::qpdf
          cache: true
          cache-version: 2

      - name: Sanity check ABI + paquets
        run: |
          Rscript -e '
            cat("R:", R.version.string, "\n");
            cat("Libs:", paste(.libPaths(), collapse=" | "), "\n");
            pkgs <- c("rlang","dplyr","readr","stringr","tibble","tidyr",
                      "purrr","openxlsx","lubridate","rvest","pdftools",
                      "base64enc","ggplot2","xml2","httr","zoo","glue",
                      "digest","jsonlite");
            for (p in pkgs) cat(sprintf("%-12s %s\n", p,
              requireNamespace(p, quietly=TRUE)));
            stopifnot(all(vapply(pkgs, requireNamespace,
              logical(1), quietly=TRUE)));
            cat("ABI + packages OK\n")
          '

      - name: Check email secrets
        run: |
          Rscript -e 'required <- c("SMTP_USER","SMTP_PASS","SMTP_HOST","SMTP_PORT","ALERT_FROM","ALERT_TO"); missing <- required[!nzchar(Sys.getenv(required))]; if (length(missing) > 0) stop("Secrets email manquants: ", paste(missing, collapse=", ")); cat("Email secrets OK\n")'

      - name: Check WhatsApp secrets if enabled
        run: |
          Rscript -e 'enabled <- toupper(Sys.getenv("WA_ENABLED","FALSE")) %in% c("TRUE","1","YES","Y"); if (enabled) { required <- c("WA_ACCESS_TOKEN","WA_PHONE_NUMBER_ID","WA_TO"); missing <- required[!nzchar(Sys.getenv(required))]; if (length(missing) > 0) stop("Secrets WhatsApp manquants: ", paste(missing, collapse=", ")); cat("WhatsApp secrets OK\n") } else { cat("WhatsApp disabled\n") }'

      - name: Check no legacy curl SMTP sender
        run: |
          if grep -nE 'Erreur envoi SMTP curl|curl_bin|curl::mime|curl::send_mail' scripts/00_email_smtp_base.R; then
            echo 'Legacy curl SMTP email sender detected. Stop.'
            exit 1
          fi
          echo 'No legacy curl SMTP email sender'

      - name: Parse R scripts
        env:
          SEND: false
          SEND_EMAIL: false
          SEND_ALERTS: false
          PREIS_SEND: false
          PREIS_SEND_EMAIL: false
          EMAIL_ENABLED: false
          PREIS_EMAIL_ENABLED: false
          FORCE_SEND: false
          PREIS_FORCE_SEND: false
        run: |
          Rscript -e 'parse(file="scripts/00_email_smtp_base.R", encoding="UTF-8"); parse(file="scripts/08_cloud_sitrep_monitor.R", encoding="UTF-8"); parse(file="scripts/preis_safe_scientific_email.R", encoding="UTF-8"); parse(file="preis_email_enrichi.R", encoding="UTF-8"); if (file.exists("scripts/10_whatsapp_notify.R")) parse(file="scripts/10_whatsapp_notify.R", encoding="UTF-8"); cat("R parse OK\n")'

      # PREIS SAFE EMAIL GUARANTEE START
      - name: PREIS safe scientific email guarantee
        if: always()
        env:
          PREIS_SAFE_EMAIL_ENABLED: "false"
          PREIS_FORCE_SEND: ${{ github.event_name == 'workflow_dispatch' && inputs.force_send || 'false' }}
          FORCE_SEND: ${{ github.event_name == 'workflow_dispatch' && inputs.force_send || 'false' }}
          PREIS_SAFE_EMAIL_TO: ${{ secrets.PREIS_SAFE_EMAIL_TO }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: Rscript scripts/preis_safe_scientific_email.R
      # PREIS SAFE EMAIL GUARANTEE END

      # PREIS SAFE EMAIL STATE COMMIT START
      - name: Commit PREIS safe email notification state
        if: always()
        run: |
          set +e
          if [ -f data/preis_safe_email_notification_state.csv ]; then
            git config user.name "PREIS Ebola DRC Automation"
            git config user.email "preis-automation@users.noreply.github.com"
            git add data/preis_safe_email_notification_state.csv
            git diff --cached --quiet && echo "No safe email state change to commit" && exit 0
            git commit -m "Update PREIS safe email notification state [skip ci]"
            git push
          else
            echo "No safe email state file found"
          fi
          exit 0
      # PREIS SAFE EMAIL STATE COMMIT END

      - name: Run PREIS SitRep monitor
        continue-on-error: true
        run: |
          Rscript scripts/08_cloud_sitrep_monitor.R

      # PREIS END-TO-END ANALYTICS V2 START
      - name: Verify master pipeline R packages
        if: always()
        run: |
          Rscript -e '
            pkgs <- c("dplyr","readr","stringr","tibble","tidyr","purrr",
                      "openxlsx","glue","lubridate","rvest","httr",
                      "pdftools","base64enc","ggplot2","zoo","xml2",
                      "digest","jsonlite");
            missing <- pkgs[!vapply(pkgs, requireNamespace,
              logical(1), quietly=TRUE)];
            if (length(missing) > 0) stop(
              "Master pipeline packages missing before execution: ",
              paste(missing, collapse=", "));
            cat("Master pipeline package verification OK.\n")
          '

      - name: Parse PREIS master and validation scripts
        run: |
          Rscript -e 'parse(file="scripts/00_PREIS_MASTER_AUTOMATION.R", encoding="UTF-8"); parse(file="scripts/12_validate_pipeline_freshness.R", encoding="UTF-8"); cat("Master and validation scripts parse OK\n")'

      - name: Run PREIS master automation
        run: |
          Rscript scripts/00_PREIS_MASTER_AUTOMATION.R

      # PREIS FILET DE SECURITE (N65+)
      # Complete les cumuls nationaux MANQUANTS directement dans la base a
      # partir des PDF, pour que la serie et la validation suivent le dernier
      # SitRep meme si l'extraction du master rate le plus recent.
      - name: Backfill cumuls nationaux (filet de securite)
        continue-on-error: true
        run: |
          Rscript scripts/preis_backfill_national.R

      - name: Indicateurs journaliers INRB
        continue-on-error: true
        run: |
          Rscript scripts/11_daily_indicators.R || echo "11_daily_indicators.R en attente de mise à jour INRB"

      - name: Analyse consolidee - serie temporelle nationale
        run: |
          Rscript scripts/03_analyse_consolidee.R

      - name: Generate Africa CDC SitRep supplement
        continue-on-error: true
        run: |
          Rscript scripts/06_generate_africa_cdc_sitrep_final.R

      - name: Send Africa CDC SitRep email
        continue-on-error: true
        run: |
          Rscript scripts/05_send_africacdc_sitrep_email.R

      - name: Validate SitRep pipeline freshness
        run: |
          Rscript scripts/12_validate_pipeline_freshness.R
      # PREIS END-TO-END ANALYTICS V2 END

      # PREIS DASHBOARD DATA SYNC START
      - name: Synchroniser les donnees du dashboard
        if: success()
        run: |
          mkdir -p dashboard_ebola/data
          if [ -f outputs/analyse/serie_temporelle_nationale.csv ]; then
            cp -f outputs/analyse/serie_temporelle_nationale.csv dashboard_ebola/data/serie_temporelle_nationale.csv
          else
            echo 'Serie nationale absente - synchronisation ignoree'
          fi
          if [ -f outputs/analyse/tableau_zones_sante.csv ]; then
            cp -f outputs/analyse/tableau_zones_sante.csv dashboard_ebola/data/tableau_zones_sante.csv
          else
            echo 'Tableau zones absent - synchronisation ignoree'
          fi
      # PREIS DASHBOARD DATA SYNC END

      # PREIS ENRICHED EMAIL START
      - name: Send PREIS enriched email
        if: success() && env.PREIS_SEND_EMAIL == 'true'
        continue-on-error: true
        run: |
          if [ -f preis_email_enrichi.R ]; then
            Rscript -e 'parse(file="preis_email_enrichi.R", encoding="UTF-8"); cat("preis_email_enrichi.R parse OK\n")'
            Rscript preis_email_enrichi.R
          else
            echo "preis_email_enrichi.R absent - skip enriched email"
          fi
      # PREIS ENRICHED EMAIL END

      - name: Commit monitor + pipeline outputs
        if: always()
        run: |
          git add outputs/rapports/*.docx || true
          git config user.name "PREIS Ebola Automation"
          git config user.email "actions@github.com"
          git add data/monitor_state/ data/pdf/ data/logs/ outputs/cloud_monitor/ || true
          git add data/final/PREIS_indicators_long.csv || true
          git add data/final/PREIS_daily_indicators.csv || true
          git add data/final/PREIS_indicators_validated.csv || true
          git add data/final/PREIS_health_zones.csv || true
          git add data/final/PREIS_QC_by_sitrep.csv || true
          git add data/final/PREIS_QC_issues.csv || true
          git add data/final/PREIS_signals.csv || true
          git add data/final/PREIS_signals_text.txt || true
          git add data/final/PREIS_validation_signals.csv || true
          git add data/final/PREIS_validation_vs_INRB.csv || true
          git add data/final/sitrep_registry.csv || true
          git add outputs/analyse/serie_temporelle_nationale.csv || true
          git add outputs/analyse/tableau_zones_sante.csv || true
          git add outputs/audit/ || true
          git add data/preis_email_enrichi_state.csv || true
          git add data/preis_africacdc_email_state.csv || true
          git add dashboard_ebola/data/serie_temporelle_nationale.csv || true
          git add dashboard_ebola/data/tableau_zones_sante.csv || true
          git status --short
          git commit -m "PREIS pipeline: monitor + extraction + analyse [skip ci]" || echo "No changes to commit"
          git pull --rebase origin main || echo "No remote changes to rebase"
          git push || echo "No changes to push"
