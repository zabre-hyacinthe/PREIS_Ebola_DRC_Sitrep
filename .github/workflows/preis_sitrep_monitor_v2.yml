name: PREIS Ebola DRC SitRep Monitor V2

on:
  workflow_dispatch:
    inputs:
      send:
        description: "Send PREIS email alerts"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      force_send:
        description: "Force send during manual test"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
  repository_dispatch:
    types: [preis_monitor]
  schedule:
    - cron: "7,37 * * * *"
env:
  SEND: "${{ github.event_name == 'workflow_dispatch' && inputs.send || 'true' }}"
  SEND_EMAIL: "${{ github.event_name == 'workflow_dispatch' && inputs.send || 'true' }}"
  SEND_ALERTS: "${{ github.event_name == 'workflow_dispatch' && inputs.send || 'true' }}"
  PREIS_SEND: "${{ github.event_name == 'workflow_dispatch' && inputs.send || 'true' }}"
  PREIS_SEND_EMAIL: "${{ github.event_name == 'workflow_dispatch' && inputs.send || 'true' }}"
  EMAIL_ENABLED: "${{ github.event_name == 'workflow_dispatch' && inputs.send || 'true' }}"
  PREIS_EMAIL_ENABLED: "${{ github.event_name == 'workflow_dispatch' && inputs.send || 'true' }}"
  FORCE_SEND: "${{ github.event_name == 'workflow_dispatch' && inputs.force_send || 'false' }}"
  PREIS_FORCE_SEND: "${{ github.event_name == 'workflow_dispatch' && inputs.force_send || 'false' }}"
  DRY_RUN: "false"
permissions:
  contents: write

concurrency:
  group: preis-sitrep-monitor-v2
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      PREIS_DRY_RUN: 'FALSE'
      PREIS_MONITOR_EMAIL_ENABLED: 'FALSE'
      PREIS_MAX_PAGES: '6'
      R_LIBS_SITE: /usr/local/lib/R/site-library:/usr/lib/R/site-library

      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      ALERT_FROM: ${{ secrets.ALERT_FROM }}
      ALERT_TO: ${{ secrets.ALERT_TO }}
      ALERT_CC: ${{ secrets.ALERT_CC }}
      ALERT_BCC: ${{ secrets.ALERT_BCC }}

      WA_ENABLED: ${{ secrets.WA_ENABLED }}
      WA_ACCESS_TOKEN: ${{ secrets.WA_ACCESS_TOKEN }}
      WA_PHONE_NUMBER_ID: ${{ secrets.WA_PHONE_NUMBER_ID }}
      WA_TO: ${{ secrets.WA_TO }}
      WA_API_VERSION: ${{ secrets.WA_API_VERSION }}
      WA_STRICT: ${{ secrets.WA_STRICT }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup R
        uses: r-lib/actions/setup-r@v2

      - name: Confirm Python available
        run: |
          python3 --version

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libpoppler-cpp-dev \
            libfontconfig1-dev \
            libqpdf-dev \
            pkg-config \
            r-cran-qpdf \
            r-cran-pdftools \
            make


      - name: Confirm pdftools binary package
        run: |
          Rscript --vanilla - <<'RSCRIPT'
          site_libs <- c(
            "/usr/local/lib/R/site-library",
            "/usr/lib/R/site-library"
          )
          site_libs <- site_libs[dir.exists(site_libs)]
          .libPaths(unique(c(site_libs, .libPaths())))

          cat("R library paths:", paste(.libPaths(), collapse = " | "), "\n")

          if (!requireNamespace("pdftools", quietly = TRUE)) {
            stop(
              "The Ubuntu pdftools binary package is not visible to R.",
              call. = FALSE
            )
          }

          cat(
            "pdftools available, version:",
            as.character(utils::packageVersion("pdftools")),
            "\n"
          )
          RSCRIPT

      - name: Configure CRAN and install all PREIS R packages
        shell: bash
        env:
          PREIS_CRAN_REPO: https://cloud.r-project.org
        run: |
          Rscript --vanilla - <<'RSCRIPT'
          cran <- Sys.getenv(
            "PREIS_CRAN_REPO",
            unset = "https://cloud.r-project.org"
          )
          options(repos = c(CRAN = cran))

          site_libs <- c(
            "/usr/local/lib/R/site-library",
            "/usr/lib/R/site-library"
          )
          site_libs <- site_libs[dir.exists(site_libs)]
          .libPaths(unique(c(site_libs, .libPaths())))

          pkgs <- c(
            "httr", "rvest", "xml2", "stringr", "dplyr",
            "readr", "tibble", "tidyr", "purrr", "digest",
            "base64enc", "jsonlite", "pdftools", "lubridate",
            "ggplot2", "openxlsx", "zoo", "glue"
          )

          cat("CRAN repository:", getOption("repos")[["CRAN"]], "\n")
          cat("R library paths:", paste(.libPaths(), collapse = " | "), "\n")

          missing <- pkgs[
            !vapply(pkgs, requireNamespace, logical(1), quietly = TRUE)
          ]

          if (length(missing) > 0) {
            cat("Installing:", paste(missing, collapse = ", "), "\n")
            install.packages(
              missing,
              repos = c(CRAN = cran),
              dependencies = NA
            )
          }

          missing_after <- pkgs[
            !vapply(pkgs, requireNamespace, logical(1), quietly = TRUE)
          ]

          if (length(missing_after) > 0) {
            stop(
              "Packages still missing: ",
              paste(missing_after, collapse = ", ")
            )
          }

          cat("All PREIS R packages are available.\n")
          RSCRIPT

      - name: Check email secrets
        run: |
          Rscript --vanilla -e 'required <- c("SMTP_USER","SMTP_PASS","SMTP_HOST","SMTP_PORT","ALERT_FROM","ALERT_TO"); missing <- required[!nzchar(Sys.getenv(required))]; if (length(missing) > 0) stop("Secrets email manquants: ", paste(missing, collapse=", ")); cat("Email secrets OK\n")'

      - name: Check WhatsApp secrets if enabled
        run: |
          Rscript --vanilla -e 'enabled <- toupper(Sys.getenv("WA_ENABLED","FALSE")) %in% c("TRUE","1","YES","Y"); if (enabled) { required <- c("WA_ACCESS_TOKEN","WA_PHONE_NUMBER_ID","WA_TO"); missing <- required[!nzchar(Sys.getenv(required))]; if (length(missing) > 0) stop("Secrets WhatsApp manquants: ", paste(missing, collapse=", ")); cat("WhatsApp secrets OK\n") } else { cat("WhatsApp disabled\n") }'

      - name: Check no legacy curl SMTP sender
        run: |
          if grep -nE 'Erreur envoi SMTP curl|curl_bin|curl::mime|curl::send_mail' scripts/00_email_smtp_base.R; then
            echo 'Legacy curl SMTP email sender detected. Stop.'
            exit 1
          fi
          echo 'No legacy curl SMTP email sender'

      - name: Parse R scripts
        env:
          SEND: false
          SEND_EMAIL: false
          SEND_ALERTS: false
          PREIS_SEND: false
          PREIS_SEND_EMAIL: false
          EMAIL_ENABLED: false
          PREIS_EMAIL_ENABLED: false
          FORCE_SEND: false
          PREIS_FORCE_SEND: false
        run: |
          Rscript --vanilla -e 'parse(file="scripts/00_email_smtp_base.R", encoding="UTF-8"); parse(file="scripts/08_cloud_sitrep_monitor.R", encoding="UTF-8"); parse(file="scripts/preis_safe_scientific_email.R", encoding="UTF-8"); parse(file="preis_email_enrichi.R", encoding="UTF-8"); if (file.exists("scripts/10_whatsapp_notify.R")) parse(file="scripts/10_whatsapp_notify.R", encoding="UTF-8"); cat("R parse OK\n")'

      # PREIS SAFE EMAIL GUARANTEE START
      - name: PREIS safe scientific email guarantee
        if: always()
        env:
          # Keep the robust INSP/PDF resolver, but do not send the old PDF-only email.
          # The single notification is sent later by preis_email_enrichi.R after analysis.
          PREIS_SAFE_EMAIL_ENABLED: "false"
          PREIS_FORCE_SEND: ${{ github.event_name == 'workflow_dispatch' && inputs.force_send || 'false' }}
          FORCE_SEND: ${{ github.event_name == 'workflow_dispatch' && inputs.force_send || 'false' }}
          PREIS_SAFE_EMAIL_TO: ${{ secrets.PREIS_SAFE_EMAIL_TO }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: Rscript --vanilla scripts/preis_safe_scientific_email.R
      # PREIS SAFE EMAIL GUARANTEE END
      # PREIS SAFE EMAIL STATE COMMIT START
      - name: Commit PREIS safe email notification state
        if: always()
        run: |
          set +e
          if [ -f data/preis_safe_email_notification_state.csv ]; then
            git config user.name "PREIS Ebola DRC Automation"
            git config user.email "preis-automation@users.noreply.github.com"
            git add data/preis_safe_email_notification_state.csv
            git diff --cached --quiet && echo "No safe email state change to commit" && exit 0
            git commit -m "Update PREIS safe email notification state [skip ci]"
            git push
          else
            echo "No safe email state file found"
          fi
          exit 0
      # PREIS SAFE EMAIL STATE COMMIT END
      - name: Run PREIS SitRep monitor
        continue-on-error: true
        run: |
          Rscript --vanilla scripts/08_cloud_sitrep_monitor.R

      # PREIS END-TO-END ANALYTICS V2 START
      # Le détecteur précoce et le résolveur restent inchangés.
      # Le pipeline maître consomme ensuite le PDF officiel déjà présent
      # dans data/pdf, même avant son affichage sur la page publique.
      - name: Verify master pipeline R packages
        if: always()
        env:
          PREIS_CRAN_REPO: https://cloud.r-project.org
        run: |
          Rscript --vanilla - <<'RSCRIPT'
          options(
            repos = c(
              CRAN = Sys.getenv(
                "PREIS_CRAN_REPO",
                unset = "https://cloud.r-project.org"
              )
            )
          )

          site_libs <- c(
            "/usr/local/lib/R/site-library",
            "/usr/lib/R/site-library"
          )
          site_libs <- site_libs[dir.exists(site_libs)]
          .libPaths(unique(c(site_libs, .libPaths())))

          pkgs <- c(
            "dplyr", "readr", "stringr", "tibble", "tidyr",
            "purrr", "openxlsx", "glue", "lubridate",
            "rvest", "httr", "pdftools", "base64enc",
            "ggplot2", "zoo", "xml2", "digest", "jsonlite"
          )

          missing <- pkgs[
            !vapply(pkgs, requireNamespace, logical(1), quietly = TRUE)
          ]

          if (length(missing) > 0) {
            stop(
              "Master pipeline packages missing before execution: ",
              paste(missing, collapse = ", ")
            )
          }

          cat("Master pipeline package verification OK.\n")
          RSCRIPT

      - name: Parse PREIS master and validation scripts
        run: |
          Rscript --vanilla -e 'parse(file="scripts/00_PREIS_MASTER_AUTOMATION.R", encoding="UTF-8"); parse(file="scripts/12_validate_pipeline_freshness.R", encoding="UTF-8"); cat("Master and validation scripts parse OK\n")'

      - name: Run PREIS master automation
        env:
          PREIS_CRAN_REPO: https://cloud.r-project.org
        run: |
          Rscript --vanilla scripts/00_PREIS_MASTER_AUTOMATION.R

      - name: Indicateurs journaliers INRB
        continue-on-error: true
        run: |
          Rscript --vanilla scripts/11_daily_indicators.R || echo "11_daily_indicators.R en attente de mise à jour INRB"

      - name: Analyse consolidee - serie temporelle nationale
        run: |
          Rscript --vanilla scripts/03_analyse_consolidee.R

      - name: Validate SitRep pipeline freshness
        run: |
          Rscript --vanilla scripts/12_validate_pipeline_freshness.R
      # PREIS END-TO-END ANALYTICS V2 END
      # PREIS DASHBOARD DATA SYNC START
      - name: Synchroniser les donnees du dashboard
        if: success()
        run: |
          mkdir -p dashboard_ebola/data
          if [ -f outputs/analyse/serie_temporelle_nationale.csv ]; then
            cp -f outputs/analyse/serie_temporelle_nationale.csv dashboard_ebola/data/serie_temporelle_nationale.csv
          else
            echo 'Serie nationale absente - synchronisation ignoree'
          fi
          if [ -f outputs/analyse/tableau_zones_sante.csv ]; then
            cp -f outputs/analyse/tableau_zones_sante.csv dashboard_ebola/data/tableau_zones_sante.csv
          else
            echo 'Tableau zones absent - synchronisation ignoree'
          fi
      # PREIS DASHBOARD DATA SYNC END
      # PREIS ENRICHED EMAIL START
      - name: Send PREIS enriched email
        if: success() && env.PREIS_SEND_EMAIL == 'true'
        continue-on-error: true
        run: |
          if [ -f preis_email_enrichi.R ]; then
            Rscript --vanilla -e 'parse(file="preis_email_enrichi.R", encoding="UTF-8"); cat("preis_email_enrichi.R parse OK\n")'
            Rscript --vanilla preis_email_enrichi.R
          else
            echo "preis_email_enrichi.R absent - skip enriched email"
          fi
      # PREIS ENRICHED EMAIL END
      - name: Commit monitor + pipeline outputs
        if: always()
        run: |
          git config user.name "PREIS Ebola Automation"
          git config user.email "actions@github.com"
          git add data/monitor_state/ data/pdf/ data/logs/ outputs/cloud_monitor/ || true
          git add data/final/PREIS_indicators_long.csv || true
          git add data/final/PREIS_daily_indicators.csv || true
          git add data/final/PREIS_indicators_validated.csv || true
          git add data/final/PREIS_health_zones.csv || true
          git add data/final/PREIS_QC_by_sitrep.csv || true
          git add data/final/PREIS_QC_issues.csv || true
          git add data/final/PREIS_signals.csv || true
          git add data/final/PREIS_signals_text.txt || true
          git add data/final/PREIS_validation_signals.csv || true
          git add data/final/PREIS_validation_vs_INRB.csv || true
          git add data/final/sitrep_registry.csv || true
          git add outputs/analyse/serie_temporelle_nationale.csv || true
          git add outputs/analyse/tableau_zones_sante.csv || true
          git add outputs/audit/ || true
          git add data/preis_email_enrichi_state.csv || true
          git add dashboard_ebola/data/serie_temporelle_nationale.csv || true
          git add dashboard_ebola/data/tableau_zones_sante.csv || true
          git status --short
          git commit -m "PREIS pipeline: monitor + extraction + analyse [skip ci]" || echo "No changes to commit"
          git pull --rebase origin main || echo "No remote changes to rebase"
          git push || echo "No changes to push"
